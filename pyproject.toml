[project]
name = "jevex"
version = "0.1.0"
description = "Jev directs an agent; a LangChain LLM supplies only content."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "langchain-openai>=1.0,<2",
  "mcp>=1.12,<2",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
]

[project.scripts]
jevex = "jevex.cli:main"
jevex-benchmark = "jevex.benchmark:main"

[project.optional-dependencies]
benchmark = [
    "mcp-server-fetch>=2026.8.18",
    "mcp-server-git>=2026.8.18",
    "tiktoken>=0.12,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
